# Deterministic unit tests only (no model, no downloads): the DPP selector and the P9 fact kernel.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy pytest
      - run: python tests/test_dpp.py
      - run: python -m pytest -q tests/test_fact_kernel.py
